<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musiquita · ¿Qué canción es?</title>
  <meta name="description" content="Adiviná la canción con tus amigos. Fragmentos de miles de temas, buzzers, pistas y puntaje.">

  <meta name="theme-color" content="#0f2747">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Musiquita">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="logo" aria-hidden="true">🎵</div>
      <div>
        <div class="brand">Musiquita</div>
        <div class="tag">¿Qué canción es?</div>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <div id="cta" class="cta" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Secciones">
      <button data-a="tab" data-t="play" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg><b>Jugar</b></button>
      <button data-a="tab" data-t="cats"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></svg><b>Géneros</b></button>
      <button data-a="tab" data-t="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5.2a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.2a1.7 1.7 0 0 0 0 3.4c.6 0 1.8-.1 2.8-1.4"/><path d="M16 6h2.8a1.7 1.7 0 0 1 0 3.4c-.6 0-1.8-.1-2.8-1.4"/><path d="M12 13.2V17M8.5 20h7M10 17h4"/></svg><b>Historial</b></button>
      <button data-a="tab" data-t="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg><b>Ajustes</b></button>
    </nav>
  </div>

  <div id="game" class="game" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="au" playsinline preload="auto"></audio>

  <noscript><p style="padding:24px;font-family:sans-serif">Musiquita necesita JavaScript para funcionar.</p></noscript>
  <script src="data.js"></script>
  <script src="resolve.js"></script>
  <script src="app.js"></script>
</body>
</html>
